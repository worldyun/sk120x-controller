name: PlatformIO CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.platformio/.cache
        key: ${{ runner.os }}-pio
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install PlatformIO Core
      run: pip install --upgrade platformio

    - name : Install esptool
      run: pip install esptool

    - name: Build PlatformIO Project
      run: pio run

    - name: Merge firmware binaries
      run: esptool --chip esp32c3 merge_bin -o .pio/build/airm2m_core_esp32c3/sk120x-controller.bin \
            0x1000 .pio/build/airm2m_core_esp32c3/bootloader.bin \
            0x8000 .pio/build/airm2m_core_esp32c3/partitions.bin \
            0x10000 .pio/build/airm2m_core_esp32c3/firmware.bin

    - name: Upload firmware artifacts
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: firmware
        path: .pio/build/**/*.bin